[project]
name = "momentum-screener"
version = "0.1.0"
description = "Neural-network based initial momentum screener for Japanese equities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "torch>=2.0",
  "yfinance>=0.2.40",
]

[project.scripts]
momentum-screener = "momentum_screener.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
